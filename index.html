<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>废品价格识别</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
    body {
      background: radial-gradient(ellipse at top, #134e4a 0%, #0b1220 55%);
      min-height: 100vh;
      min-height: 100dvh;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.5;
    }
    .wrap {
      max-width: 28rem;
      margin: 0 auto;
      padding: 1.25rem 1rem calc(1.5rem + env(safe-area-inset-bottom));
    }
    .glass {
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 1rem;
    }
    .camera-box {
      position: relative;
      aspect-ratio: 4/3;
      background: #000;
      border-radius: 1.25rem;
      overflow: hidden;
      margin-bottom: 1rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    #video, #preview {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    #preview { display: none; }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      border: none;
      border-radius: 1rem;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      color: #fff;
      padding: 0.9rem 0.5rem;
    }
    .btn:active { opacity: 0.9; transform: scale(0.98); }
    .btn-primary {
      background: linear-gradient(135deg, #0d9488, #14b8a6);
      flex: 1;
    }
    .btn-secondary {
      background: #1e293b;
      border: 1px solid #475569;
      width: 4.5rem;
      flex-shrink: 0;
    }
    .btn-row {
      display: flex;
      gap: 0.6rem;
      margin-bottom: 1rem;
    }
    .price-big {
      background: linear-gradient(135deg, #0f766e 0%, #14b8a6 100%);
      padding: 1.4rem 1.25rem;
      text-align: center;
    }
    .loader {
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: #14b8a6;
      border-radius: 50%;
      width: 32px; height: 32px;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .fade-in { animation: fadeIn 0.28s ease; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .hidden { display: none !important; }
    .text-xs { font-size: 0.75rem; }
    .text-sm { font-size: 0.875rem; }
    .text-muted { color: #94a3b8; }
    .text-dim { color: #64748b; }
    .text-teal { color: #5eead4; }
    details summary {
      padding: 0.85rem 1rem;
      cursor: pointer;
      list-style: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
    }
    details summary::-webkit-details-marker { display: none; }
  </style>
</head>
<body>
  <div class="wrap">

    <header style="margin-bottom:1.1rem;">
      <h1 style="font-size:1.35rem;font-weight:700;">废品价格识别</h1>
      <p class="text-xs text-teal" style="opacity:0.8;margin-top:3px;">拍照即可识别原材料</p>
    </header>

    <!-- 相机区域 -->
    <div class="camera-box">
      <video id="video" autoplay playsinline muted></video>
      <img id="preview" alt="预览" />
      <div id="cameraTip" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.55);font-size:0.875rem;color:#cbd5e1;pointer-events:none;">
        正在启动相机...
      </div>
    </div>

    <!-- 按钮 -->
    <div class="btn-row">
      <button id="btnMain" onclick="onCapture()" class="btn btn-primary">
        <svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        拍照识别
      </button>
      <label class="btn btn-secondary">
        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
        <input type="file" accept="image/*" style="display:none;" onchange="onUpload(event)" />
      </label>
    </div>

    <!-- 加载中 -->
    <div id="loading" class="glass hidden" style="padding:1.4rem;margin-bottom:1rem;display:flex;flex-direction:column;align-items:center;gap:0.8rem;">
      <div class="loader"></div>
      <p class="text-sm text-teal">正在识别原材料...</p>
    </div>

    <!-- 结果 -->
    <div id="resultCard" class="glass hidden fade-in" style="overflow:hidden;margin-bottom:1.2rem;">
      <div class="price-big">
        <p class="text-xs" style="opacity:0.9;margin-bottom:6px;" id="resultName">—</p>
        <p style="font-size:2rem;font-weight:700;letter-spacing:-0.02em;" id="resultPrice">—</p>
        <p class="text-xs" style="opacity:0.85;margin-top:4px;">元 / 公斤</p>
      </div>
      <div style="padding:1.1rem 1.15rem;">
        <div style="display:flex;gap:0.5rem;margin-bottom:0.55rem;font-size:0.875rem;">
          <span class="text-muted" style="flex-shrink:0;">说明</span>
          <span id="resultDesc"></span>
        </div>
        <div style="display:flex;gap:0.5rem;margin-bottom:0.9rem;font-size:0.875rem;">
          <span class="text-muted" style="flex-shrink:0;">提示</span>
          <span id="resultTip"></span>
        </div>
        <button onclick="resetAll()" class="btn btn-secondary" style="width:100%;border-radius:0.85rem;">再识别一次</button>
      </div>
    </div>

    <!-- 原材料参考价格 -->
    <details class="glass" open>
      <summary>
        <span>原材料参考价格</span>
        <span class="text-xs text-dim">收起</span>
      </summary>
      <div id="allPrices" style="padding:0 1rem 1rem;font-size:0.8rem;"></div>
    </details>

  </div>

  <script>
    // ========== 配置 ==========
    const API_KEY = "AQ.Ab8RN6JP9QmKS6l8Sb3TREQNdF-wgafmMVKrc-Em8J2apYMlrA";

    // 详细价格数据
    const DATA = {
      "铜": {
        icon: "🟤",
        items: [
          { name: "光亮铜", price: "90 ~ 91", desc: "干净光亮的紫铜线、铜管、铜板", tip: "纯度越高越好，带皮带漆会降价" },
          { name: "紫杂铜", price: "85 ~ 88", desc: "普通紫铜废料", tip: "尽量分类干净" },
          { name: "电缆铜", price: "88 ~ 91", desc: "电缆铜芯 / 铜米", tip: "含铜量高更值钱" },
          { name: "马达铜", price: "85 ~ 87", desc: "电机绕组铜", tip: "拆解后价格更高" },
          { name: "黄铜", price: "62 ~ 65", desc: "黄铜管件、边角料", tip: "干净边料更好" },
          { name: "黄杂铜", price: "55 ~ 60", desc: "混杂黄铜", tip: "杂质多价格偏低" }
        ]
      },
      "铝": {
        icon: "⚪",
        items: [
          { name: "型材铝", price: "19 ~ 20", desc: "门窗、工业铝型材", tip: "无钉无喷涂价格最高" },
          { name: "易拉罐", price: "17 ~ 18", desc: "饮料铝罐", tip: "压扁干净更好卖" },
          { name: "生铝", price: "16 ~ 18", desc: "铸铝件、机件", tip: "含铁油污会降价" },
          { name: "铝线", price: "19.5 ~ 21", desc: "干净铝线", tip: "纯度高价格更好" }
        ]
      },
      "铁": {
        icon: "⬛",
        items: [
          { name: "重废", price: "2.2 ~ 2.4", desc: "厚度≥6mm钢板、工角槽", tip: "越厚越干净越好" },
          { name: "中废", price: "2.0 ~ 2.2", desc: "厚度4-6mm边角料", tip: "分类清楚更有优势" },
          { name: "轻薄料", price: "1.7 ~ 2.0", desc: "薄铁皮、彩钢瓦", tip: "带油带漆会降价" },
          { name: "钢筋", price: "2.2 ~ 2.4", desc: "建筑钢筋", tip: "干净直料更好" },
          { name: "生铁", price: "1.9 ~ 2.2", desc: "铸铁件", tip: "看含铁量" }
        ]
      },
      "不锈钢": {
        icon: "🔷",
        items: [
          { name: "304不锈钢", price: "10 ~ 11", desc: "常见304材质", tip: "磁铁几乎不吸" },
          { name: "201不锈钢", price: "4.5 ~ 5.5", desc: "201材质", tip: "磁铁可吸，价格较低" },
          { name: "316不锈钢", price: "18 ~ 22", desc: "316材质", tip: "确认材质后价格更高" }
        ]
      },
      "纸": {
        icon: "📄",
        items: [
          { name: "纸箱", price: "1.2 ~ 1.6", desc: "黄板纸、纸箱", tip: "干燥无油污" },
          { name: "书本纸", price: "1.5 ~ 2.0", desc: "旧书报纸", tip: "干净无受潮" },
          { name: "杂纸", price: "0.8 ~ 1.2", desc: "混合废纸", tip: "分类后价格提升" }
        ]
      },
      "塑料": {
        icon: "🧴",
        items: [
          { name: "PET瓶", price: "3.5 ~ 4.5", desc: "矿泉水瓶等", tip: "压扁去盖更好" },
          { name: "硬塑料", price: "2.5 ~ 4.0", desc: "硬质塑料", tip: "按材质分类更值钱" },
          { name: "泡沫", price: "0.8 ~ 1.5", desc: "泡沫包装", tip: "体积大价值低" }
        ]
      }
    };

    // 识别结果用的大类价格
    const PRICE_MAP = {
      "铜":   { price: "85 ~ 91", desc: "铜类废料（光亮铜、紫杂铜、电缆铜等）", tip: "尽量区分光亮铜和黄铜，纯度越高越好" },
      "铝":   { price: "17 ~ 21", desc: "铝类废料（型材、易拉罐、生铝等）", tip: "型材铝价格相对较高，干净无钉更好" },
      "铁":   { price: "1.8 ~ 2.4", desc: "铁/钢废料（重废、中废、轻薄料等）", tip: "按厚度和干净程度定价，越厚越好" },
      "钢":   { price: "1.8 ~ 2.4", desc: "钢废料", tip: "与废铁类似，分类清楚更有优势" },
      "不锈钢": { price: "4.5 ~ 11", desc: "不锈钢废料（304 / 201 / 316）", tip: "304和201价格差很大，可用磁铁简单区分" },
      "纸":   { price: "0.8 ~ 2.0", desc: "废纸类（纸箱、书本纸、杂纸）", tip: "干燥无油污价格更好" },
      "塑料": { price: "0.8 ~ 4.5", desc: "塑料类（PET瓶、硬塑料、泡沫等）", tip: "PET瓶价格相对较高，尽量分类" },
      "未知": { price: "需询价", desc: "无法准确判断原材料", tip: "建议换个角度再拍，或直接询问回收站" }
    };

    let stream = null;

    // ========== 初始化 ==========
    function renderAllPrices() {
      const box = document.getElementById("allPrices");
      let html = "";
      Object.keys(DATA).forEach(cat => {
        html += `<div style="margin-bottom:1rem;">
          <div style="font-weight:500;color:#cbd5e1;margin-bottom:0.4rem;">${DATA[cat].icon} ${cat}</div>`;
        DATA[cat].items.forEach(item => {
          html += `<div style="display:flex;justify-content:space-between;color:#94a3b8;margin-bottom:3px;">
            <span>${item.name}</span>
            <span style="color:#2dd4bf;">¥ ${item.price}/kg</span>
          </div>`;
        });
        html += `</div>`;
      });
      box.innerHTML = html;
    }

    async function startCamera() {
      const tip = document.getElementById("cameraTip");
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 960 } },
          audio: false
        });
        document.getElementById("video").srcObject = stream;
        tip.style.display = "none";
      } catch (e) {
        tip.textContent = "无法打开相机，请点击右侧按钮从相册选择";
        tip.style.pointerEvents = "auto";
      }
    }

    function captureBase64() {
      const video = document.getElementById("video");
      if (!stream || !video.videoWidth) return null;

      const canvas = document.createElement("canvas");
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext("2d").drawImage(video, 0, 0);
      const dataUrl = canvas.toDataURL("image/jpeg", 0.82);

      const preview = document.getElementById("preview");
      preview.src = dataUrl;
      preview.style.display = "block";
      video.style.display = "none";

      return dataUrl.split(",")[1];
    }

    function onCapture() {
      const b64 = captureBase64();
      if (!b64) {
        alert("相机未就绪，请稍候或使用相册");
        return;
      }
      recognize(b64);
    }

    function onUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const dataUrl = ev.target.result;
        const preview = document.getElementById("preview");
        preview.src = dataUrl;
        preview.style.display = "block";
        document.getElementById("video").style.display = "none";
        document.getElementById("cameraTip").style.display = "none";
        recognize(dataUrl.split(",")[1]);
      };
      reader.readAsDataURL(file);
    }

    function resetAll() {
      document.getElementById("resultCard").classList.add("hidden");
      document.getElementById("preview").style.display = "none";
      document.getElementById("video").style.display = "block";
    }

    function showResult(material) {
      const info = PRICE_MAP[material] || PRICE_MAP["未知"];
      document.getElementById("resultName").textContent = material;
      document.getElementById("resultPrice").textContent = `¥ ${info.price}`;
      document.getElementById("resultDesc").textContent = info.desc;
      document.getElementById("resultTip").textContent = info.tip;
      document.getElementById("resultCard").classList.remove("hidden");
      setTimeout(() => {
        document.getElementById("resultCard").scrollIntoView({ behavior: "smooth", block: "nearest" });
      }, 50);
    }

    // ========== AI 识别 ==========
    async function recognize(base64) {
      const loading = document.getElementById("loading");
      loading.classList.remove("hidden");
      loading.style.display = "flex";
      document.getElementById("resultCard").classList.add("hidden");

      const prompt = `你是废品回收助手。请只判断图片中主要是什么【原材料】。

只能从下面选一个最匹配的：
铜、铝、铁、钢、不锈钢、纸、塑料、未知

规则：
- 只输出原材料名称，不要写具体产品名称
- 铜相关写“铜”，铝相关写“铝”，钢铁写“铁”或“钢”
- 不确定就写“未知”

严格只返回 JSON，不要其他内容：
{"material":"铜"}`;

      try {
        const res = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${API_KEY}`,
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [{
                parts: [
                  { text: prompt },
                  { inline_data: { mime_type: "image/jpeg", data: base64 } }
                ]
              }],
              generationConfig: {
                temperature: 0.1,
                maxOutputTokens: 60
              }
            })
          }
        );

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.error?.message || `请求失败 ${res.status}`);
        }

        const data = await res.json();
        let text = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
        text = text.replace(/```json\n?/g, "").replace(/```\n?/g, "").trim();

        let result;
        try {
          result = JSON.parse(text);
        } catch {
          const m = text.match(/\{[\s\S]*?\}/);
          if (m) result = JSON.parse(m[0]);
          else throw new Error("返回格式异常");
        }

        const material = (result.material || "未知").trim();
        showResult(material);

      } catch (err) {
        alert("识别失败：" + err.message);
      } finally {
        loading.classList.add("hidden");
        loading.style.display = "none";
      }
    }

    // 启动
    renderAllPrices();
    startCamera();
  </script>
</body>
</html>
